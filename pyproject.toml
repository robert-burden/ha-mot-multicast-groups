[project]
name = "ha-mot-multicast-groups"
version = "0.1.0"
description = "PoC for Matter group multicast control of Home Assistant Thread lights"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "cryptography>=42",
]

[project.scripts]
matter-groups = "ha_mot_multicast_groups.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_mot_multicast_groups"]

[tool.hatch.build]
dev-mode-dirs = ["src"]
